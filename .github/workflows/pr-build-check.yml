name: PR build check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Jekyll build (build-only, no deployment)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@8575951200e472d5f2d95c625da0c7bec8217c42 # v1.161.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site (no deployment)
        run: bundle exec jekyll build --destination _site_check
        env:
          JEKYLL_ENV: production
